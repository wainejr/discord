[project]
name = "acelerado"
version = "0.2.0"
description = "Discord bot for the Waine - Dev do Desempenho YouTube community"
authors = [{ name = "Waine Oliveira Jr", email = "waine.oliveira.jr@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "discord.py>=2.4",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "textual>=0.80",
]

[project.scripts]
acelerado = "acelerado.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.hatch.build.targets.sdist]
include = ["acelerado"]

[tool.hatch.build.targets.wheel]
include = ["acelerado"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
