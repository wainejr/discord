[project]
name = "acelerado"
version = "0.2.0"
description = "Discord bot for the Waine - Dev do Desempenho YouTube community"
authors = [{ name = "Waine Oliveira Jr", email = "waine.oliveira.jr@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "discord.py>=2.4",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "textual>=0.80",
]

[project.scripts]
acelerado = "acelerado.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["acelerado"]
branch = true
omit = ["acelerado/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
files = ["acelerado"]
plugins = ["pydantic.mypy"]
# Pragmatic posture: catch real bugs, don't drown in third-party stub gaps.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[tool.hatch.build.targets.sdist]
include = ["acelerado"]

[tool.hatch.build.targets.wheel]
include = ["acelerado"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
